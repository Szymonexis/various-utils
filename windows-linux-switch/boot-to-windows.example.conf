# -----------------------------------------------------------------------------
# boot-to-windows.sh configuration  (plain KEY=value lines; the file is parsed, NOT sourced)
#
#   1. Copy this file to  boot-to-windows.conf  in the same folder as the script.
#      That file name is git-ignored, so your machine-specific values stay local.
#   2. Run  ./boot-to-windows.sh --list  and find the entry that boots Windows.
#   3. Replace every REPLACE_ME below. Full manual: README.md, section "Configuration".
#
# Rules: one KEY=value per line, optional surrounding quotes, # starts a comment line.
# -----------------------------------------------------------------------------

# Glob pattern (case-insensitive; * and ? allowed) that must match the WHOLE label of
# exactly one Boot#### entry as printed by --list.
# Typical values:
#   a normal Windows installation ........ "Windows Boot Manager"
#   anything containing "Windows" ........ "*Windows*"
TARGET_MATCH="REPLACE_ME"

# Optional: the exact entry number instead of a label pattern, e.g. "0000" or "Boot0000".
# When set, TARGET_MATCH is ignored. Use it only when TARGET_MATCH cannot be made unique.
TARGET_BOOTNUM=""

# Seconds to wait before rebooting (0 = immediately). Override per run with --delay.
REBOOT_DELAY=5
