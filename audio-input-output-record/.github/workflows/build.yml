# Builds the standalone apps (PyInstaller can only build for the OS it runs on).
# Run it from the Actions tab ("Run workflow") or by pushing a v* tag; the
# zipped apps are attached to the run as artifacts.
name: build-apps
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, target: windows-x64 }
          - { os: macos-15, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # python.org builds ship Tcl/Tk 8.6
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Keep the app runnable on macOS 13 (numpy's default wheel needs 14)
        if: runner.os == 'macOS'
        run: |
          v=$(python -c "import importlib.metadata as m; print(m.version('numpy'))")
          python -m pip download "numpy==$v" --only-binary=:all: --no-deps \
            --platform "macosx_13_0_$(uname -m)" -d numpy_whl \
          && python -m pip install --force-reinstall --no-deps numpy_whl/numpy-*.whl \
          || echo "no macOS 13 numpy wheel for $v; the app will need macOS 14+"
      - name: Selftest (script)
        run: python audio_rec.py --selftest
      - name: Build
        run: pyinstaller --noconfirm --clean audio-rec.spec
      - name: Verify and zip (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict "dist/Audio Recorder.app"
          "dist/Audio Recorder.app/Contents/MacOS/audio-rec" --selftest
          ditto -c -k --sequesterRsrc --keepParent "dist/Audio Recorder.app" \
            "audio-rec-${{ matrix.target }}.zip"
      - name: Verify and zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/audio-rec/audio-rec.exe" -ArgumentList "--selftest" -Wait -PassThru
          Write-Host "selftest exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            # windowed exe: its output went to the log folder
            Get-Content "$env:LOCALAPPDATA\audio-rec\logs\*.log" -ErrorAction SilentlyContinue
            exit 1
          }
          Compress-Archive -Path dist/audio-rec -DestinationPath "audio-rec-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: audio-rec-${{ matrix.target }}
          path: audio-rec-${{ matrix.target }}.zip
